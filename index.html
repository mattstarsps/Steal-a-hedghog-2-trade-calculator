<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Calculator</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #1e1f26;
      --slot-bg: #282932;
      --text-main: #ffffff;
      --text-muted: #8b8d97;
      --blue-accent: #007bf5;
      --red-accent: #ff003b;
      --green-accent: #00e676;
      --gold-accent: #f5a623;
      --purple-accent: #a855f7;
      --border-color: #333542;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
      padding-bottom: 80px; /* Espace pour le sélecteur en bas */
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { font-size: 24px; }

    .btn-admin {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-admin:hover { color: var(--text-main); border-color: var(--blue-accent); }

    .calculator-container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      align-items: flex-start;
    }

    .side-panel {
      flex: 1;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .panel-title {
      text-align: center;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .stats-bar {
      background-color: #17181f;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
    }

    .stat-value.blue { color: var(--blue-accent); }
    .stat-value.gold { color: var(--gold-accent); }
    .stat-value.red { color: var(--red-accent); }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .slot {
      background-color: var(--slot-bg);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }

    .slot:hover { border-color: var(--blue-accent); }

    .slot-add-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: rgba(0, 123, 245, 0.15);
      color: var(--blue-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .slot-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .slot-filled {
      border-style: solid;
      border-color: var(--border-color);
      padding: 10px;
      text-align: center;
    }

    .slot-mutation-tag {
      font-size: 10px;
      background: var(--purple-accent);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      display: inline-block;
    }

    .slot-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      background: var(--red-accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .center-panel {
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .status-box {
      width: 100%;
      background-color: #1c1917;
      border: 2px solid var(--gold-accent);
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
    }

    .status-icon {
      width: 40px;
      height: 40px;
      background-color: var(--gold-accent);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      margin: 0 auto 10px;
    }

    .status-text {
      font-size: 18px;
      font-weight: bold;
      color: var(--gold-accent);
    }

    .btn-reset {
      width: 100%;
      background-color: var(--red-accent);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Selecteur de langue personnalisé (Bas à gauche) */
    .language-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #05070a;
      border: 1px solid #1a2233;
      border-radius: 25px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 90;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .language-label {
      font-weight: bold;
      font-size: 16px;
      color: #ffffff;
    }

    .language-select {
      background: #000000;
      color: #ffffff;
      border: 1px solid #333d52;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }

    .language-select option {
      background-color: #0d1117;
      color: #ffffff;
    }

    /* Modal / Popups */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 450px;
      max-width: 90%;
      border: 1px solid var(--border-color);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title { margin-bottom: 15px; font-size: 18px; }

    .item-select-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .item-select-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--slot-bg);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .item-select-card:hover { background-color: var(--border-color); }

    .input-field {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--slot-bg);
      color: white;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: var(--blue-accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    .btn-danger {
      background-color: var(--red-accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-edit {
      background-color: var(--gold-accent);
      color: black;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }

    .admin-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--slot-bg);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: var(--slot-bg);
      border: 1px solid var(--border-color);
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }
    .tab-btn.active {
      background: var(--blue-accent);
    }
  </style>
</head>
<body>

  <header>
    <h1 data-i18n="app_title">Trade Calculator</h1>
    <button class="btn-admin" onclick="openAdminModal()" data-i18n="admin_btn">🔑 Admin</button>
  </header>

  <div class="calculator-container">
    <!-- Your Offer -->
    <div class="side-panel">
      <h2 class="panel-title" data-i18n="your_offer">Your Offer</h2>
      <div class="stats-bar">
        <div class="stat-item"><span class="stat-label" data-i18n="stat_value">📈 Value</span><span id="your-value" class="stat-value blue">0</span></div>
        <div class="stat-item"><span class="stat-label" data-i18n="stat_price">💰 Price</span><span id="your-price" class="stat-value gold">0</span></div>
        <div class="stat-item"><span class="stat-label" data-i18n="stat_demand">⚡ Demand</span><span id="your-demand" class="stat-value red">0/10</span></div>
      </div>
      <div class="slots-grid" id="your-slots"></div>
    </div>

    <!-- Center Panel -->
    <div class="center-panel">
      <div class="status-box" id="status-box">
        <div class="status-icon" id="status-icon">!</div>
        <div class="status-text" id="status-text">Fair Trade</div>
      </div>
      <button class="btn-reset" onclick="resetCalculator()" data-i18n="reset_btn">↺ Reset Calculator</button>
    </div>

    <!-- Their Offer -->
    <div class="side-panel">
      <h2 class="panel-title" data-i18n="their_offer">Their Offer</h2>
      <div class="stats-bar">
        <div class="stat-item"><span class="stat-label" data-i18n="stat_value">📈 Value</span><span id="their-value" class="stat-value blue">0</span></div>
        <div class="stat-item"><span class="stat-label" data-i18n="stat_price">💰 Price</span><span id="their-price" class="stat-value gold">0</span></div>
        <div class="stat-item"><span class="stat-label" data-i18n="stat_demand">⚡ Demand</span><span id="their-demand" class="stat-value red">0/10</span></div>
      </div>
      <div class="slots-grid" id="their-slots"></div>
    </div>
  </div>

  <!-- Language Selection (Bottom Left) -->
  <div class="language-container">
    <span class="language-label" data-i18n="language_label">Language:</span>
    <select id="language-select" class="language-select" onchange="changeLanguage(this.value)">
      <option value="en" selected>English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="au">Australian</option>
    </select>
  </div>

  <!-- Character Select Modal -->
  <div class="modal" id="select-modal">
    <div class="modal-content">
      <h3 class="modal-title" data-i18n="select_char_title">Select a character</h3>
      <div class="item-select-list" id="characters-list"></div>
      <button class="btn-submit" style="margin-top: 15px; background-color: var(--border-color);" onclick="closeModal('select-modal')" data-i18n="close">Close</button>
    </div>
  </div>

  <!-- Mutation Prompt Modal -->
  <div class="modal" id="mutation-prompt-modal">
    <div class="modal-content">
      <h3 class="modal-title" id="mutation-prompt-title">Does this character have a mutation?</h3>
      
      <div style="margin-bottom: 15px;">
        <label><input type="radio" name="has-mutation" value="no" checked onclick="toggleMutationSelect(false)"> <span data-i18n="no">No</span></label>
        <label style="margin-left: 15px;"><input type="radio" name="has-mutation" value="yes" onclick="toggleMutationSelect(true)"> <span data-i18n="yes">Yes</span></label>
      </div>

      <div id="mutation-select-container" style="display: none; margin-bottom: 15px;">
        <label style="font-size: 12px; color: var(--text-muted);" data-i18n="choose_mutation">Choose mutation:</label>
        <select id="mutation-dropdown" class="input-field" style="margin-top: 5px;"></select>
      </div>

      <button class="btn-submit" onclick="confirmCharacterSelection()" data-i18n="confirm">Confirm</button>
    </div>
  </div>

  <!-- Admin Auth Modal -->
  <div class="modal" id="admin-auth-modal">
    <div class="modal-content">
      <h3 class="modal-title" data-i18n="admin_access">Admin Access</h3>
      <input type="password" id="admin-pass-input" class="input-field" placeholder="Enter password...">
      <button class="btn-submit" onclick="verifyPassword()" data-i18n="submit">Submit</button>
      <button class="btn-submit" style="background-color: var(--border-color);" onclick="closeModal('admin-auth-modal')" data-i18n="cancel">Cancel</button>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div class="modal" id="admin-panel-modal">
    <div class="modal-content">
      <h3 class="modal-title" data-i18n="admin_panel">Admin Panel</h3>
      
      <div class="tabs">
        <button class="tab-btn active" id="tab-chars-btn" onclick="switchTab('chars')" data-i18n="tab_chars">Characters</button>
        <button class="tab-btn" id="tab-muts-btn" onclick="switchTab('muts')" data-i18n="tab_muts">Mutations</button>
      </div>

      <!-- Tab Chars -->
      <div id="tab-chars">
        <h4 style="margin-bottom: 10px;" id="char-form-title" data-i18n="add_edit_char">Add / Edit Character</h4>
        <input type="hidden" id="edit-char-id">
        <input type="text" id="new-name" class="input-field" placeholder="Character Name">
        <input type="number" id="new-value" class="input-field" placeholder="Value">
        <input type="number" id="new-price" class="input-field" placeholder="Price">
        <input type="number" id="new-demand" class="input-field" placeholder="Demand (0 to 10)" min="0" max="10">
        <button class="btn-submit" onclick="saveCharacter()" data-i18n="save_char">Save Character</button>

        <h4 style="margin: 20px 0 10px 0;" data-i18n="char_list">Character List</h4>
        <div id="admin-chars-list"></div>
      </div>

      <!-- Tab Mutations -->
      <div id="tab-muts" style="display: none;">
        <h4 style="margin-bottom: 10px;" id="mut-form-title" data-i18n="add_edit_mut">Add / Edit Mutation</h4>
        <input type="hidden" id="edit-mut-id">
        <input type="text" id="mut-name" class="input-field" placeholder="Mutation Name (e.g. Shiny, Gold)">
        <input type="number" id="mut-value-add" class="input-field" placeholder="Value Bonus/Malus (+100, -50...)">
        <input type="number" id="mut-price-add" class="input-field" placeholder="Price Bonus/Malus">
        <input type="number" id="mut-demand-add" class="input-field" placeholder="Demand Bonus/Malus">
        <button class="btn-submit" onclick="saveMutation()" data-i18n="save_mut">Save Mutation</button>

        <h4 style="margin: 20px 0 10px 0;" data-i18n="mut_list">Mutation List</h4>
        <div id="admin-muts-list"></div>
      </div>

      <button class="btn-submit" style="margin-top: 15px; background-color: var(--border-color);" onclick="closeModal('admin-panel-modal')" data-i18n="close">Close</button>
    </div>
  </div>

        add_edit_char: "Add / Edit Legend",
        save_char: "Save Legend",
        char_list: "Legend List",
        add_edit_mut: "Add / Edit Mutation",
        save_mut: "Save Mutation",
        mut_list: "Mutation List",
        fair_trade: "Fair Dinkum Trade",
        win_trade: "Bloody Good Trade",
        lose_trade: "Rip Off",
        has_mutation_q: "Has {name} got a mutation?"
      }
    };

    let characters = JSON.parse(localStorage.getItem('trade_chars')) || [
      { id: 1, name: "Goku", value: 500, price: 1000, demand: 8 },
      { id: 2, name: "Naruto", value: 300, price: 600, demand: 6 }
    ];

    let mutations = JSON.parse(localStorage.getItem('trade_mutations')) || [
      { id: 1, name: "Shiny", valueAdd: 200, priceAdd: 300, demandAdd: 2 },
      { id: 2, name: "Rainbow", valueAdd: 500, priceAdd: 800, demandAdd: 3 }
    ];

    let currentSide = null;
    let currentSlotIndex = null;
    let tempSelectedChar = null;

    let tradeState = {
      your: [null, null, null, null],
      their: [null, null, null, null]
    };

    function changeLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang] && i18n[lang][key]) {
          el.innerText = i18n[lang][key];
        }
      });
      renderSlots();
    }

    function renderSlots() {
      ['your', 'their'].forEach(side => {
        const container = document.getElementById(`${side}-slots`);
        container.innerHTML = '';
        tradeState[side].forEach((item, index) => {
          const slot = document.createElement('div');
          slot.className = `slot ${item ? 'slot-filled' : ''}`;
          
          if (item) {
            slot.innerHTML = `
              <button class="slot-remove" onclick="removeItem('${side}', ${index}); event.stopPropagation();">✕</button>
              <div style="font-weight: bold; font-size: 14px;">${item.name}</div>
              ${item.mutation ? `<span class="slot-mutation-tag">⚡ ${item.mutation.name}</span>` : ''}
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Val: ${item.effectiveValue} | ${i18n[currentLang].stat_price.replace('💰 ','')}: $${item.effectivePrice}</div>
            `;
          } else {
            slot.onclick = () => openSelectModal(side, index);
            slot.innerHTML = `
              <div class="slot-add-btn">+</div>
              <div class="slot-label">${i18n[currentLang].add_item}</div>
            `;
          }
          container.appendChild(slot);
        });
      });
      updateTotals();
    }

    function openSelectModal(side, slotIndex) {
      currentSide = side;
      currentSlotIndex = slotIndex;
      const list = document.getElementById('characters-list');
      list.innerHTML = '';

      characters.forEach(char => {
        const itemCard = document.createElement('div');
        itemCard.className = 'item-select-card';
        itemCard.onclick = () => openMutationPrompt(char);
        itemCard.innerHTML = `
          <div>
            <strong>${char.name}</strong><br>
            <small style="color: var(--text-muted);">Val: ${char.value} | Price: $${char.price} | Demand: ${char.demand}/10</small>
          </div>
        `;
        list.appendChild(itemCard);
      });

      document.getElementById('select-modal').style.display = 'flex';
    }

    function openMutationPrompt(char) {
      tempSelectedChar = char;
      closeModal('select-modal');

      const qText = i18n[currentLang].has_mutation_q.replace('{name}', char.name);
      document.getElementById('mutation-prompt-title').innerText = qText;
      document.querySelector('input[name="has-mutation"][value="no"]').checked = true;
      toggleMutationSelect(false);

      const dropdown = document.getElementById('mutation-dropdown');
      dropdown.innerHTML = '';
      mutations.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.innerText = `${m.name} (+${m.valueAdd} Val, +$${m.priceAdd})`;
        dropdown.appendChild(opt);
      });

      document.getElementById('mutation-prompt-modal').style.display = 'flex';
    }

    function toggleMutationSelect(show) {
      document.getElementById('mutation-select-container').style.display = show ? 'block' : 'none';
    }

    function confirmCharacterSelection() {
      const hasMut = document.querySelector('input[name="has-mutation"]:checked').value === 'yes';
      let selectedMut = null;

      if (hasMut && mutations.length > 0) {
        const mutId = parseInt(document.getElementById('mutation-dropdown').value);
        selectedMut = mutations.find(m => m.id === mutId);
      }

      const itemInstance = {
        ...tempSelectedChar,
        mutation: selectedMut,
        effectiveValue: tempSelectedChar.value + (selectedMut ? selectedMut.valueAdd : 0),
        effectivePrice: tempSelectedChar.price + (selectedMut ? selectedMut.priceAdd : 0),
        effectiveDemand: Math.min(10, Math.max(0, tempSelectedChar.demand + (selectedMut ? selectedMut.demandAdd : 0)))
      };

      tradeState[currentSide][currentSlotIndex] = itemInstance;
      closeModal('mutation-prompt-modal');
      renderSlots();
    }

    function removeItem(side, index) {
      tradeState[side][index] = null;
      renderSlots();
    }

    function updateTotals() {
      const calcStats = (side) => {
        return tradeState[side].reduce((acc, item) => {
          if (item) {
            acc.value += item.effectiveValue;
            acc.price += item.effectivePrice;
            acc.demand += item.effectiveDemand;
            acc.count++;
          }
          return acc;
        }, { value: 0, price: 0, demand: 0, count: 0 });
      };

      const yourStats = calcStats('your');
      const theirStats = calcStats('their');

      document.getElementById('your-value').innerText = yourStats.value;
      document.getElementById('your-price').innerText = yourStats.price;
      document.getElementById('your-demand').innerText = `${yourStats.count ? Math.round(yourStats.demand / yourStats.count) : 0}/10`;

      document.getElementById('their-value').innerText = theirStats.value;
      document.getElementById('their-price').innerText = theirStats.price;
      document.getElementById('their-demand').innerText = `${theirStats.count ? Math.round(theirStats.demand / theirStats.count) : 0}/10`;

      const statusBox = document.getElementById('status-box');
      const statusText = document.getElementById('status-text');
      const statusIcon = document.getElementById('status-icon');

      const diff = yourStats.value - theirStats.value;

      if (yourStats.value === 0 && theirStats.value === 0) {
        statusText.innerText = i18n[currentLang].fair_trade;
        statusBox.style.borderColor = "var(--gold-accent)";
        statusIcon.style.backgroundColor = "var(--gold-accent)";
        statusText.style.color = "var(--gold-accent)";
      } else if (Math.abs(diff) <= 100) {
        statusText.innerText = i18n[currentLang].fair_trade;
        statusBox.style.borderColor = "var(--gold-accent)";
        statusIcon.style.backgroundColor = "var(--gold-accent)";
        statusText.style.color = "var(--gold-accent)";
      } else if (diff < -100) {
        statusText.innerText = i18n[currentLang].win_trade;
        statusBox.style.borderColor = "var(--green-accent)";
        statusIcon.style.backgroundColor = "var(--green-accent)";
        statusText.style.color = "var(--green-accent)";
      } else {
        statusText.innerText = i18n[currentLang].lose_trade;
        statusBox.style.borderColor = "var(--red-accent)";
        statusIcon.style.backgroundColor = "var(--red-accent)";
        statusText.style.color = "var(--red-accent)";
      }
    }

    function resetCalculator() {
      tradeState = { your: [null, null, null, null], their: [null, null, null, null] };
      renderSlots();
    }

    // Admin
    function openAdminModal() {
      document.getElementById('admin-auth-modal').style.display = 'flex';
    }

    function verifyPassword() {
      const input = document.getElementById('admin-pass-input').value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById('admin-pass-input').value = '';
        closeModal('admin-auth-modal');
        renderAdminLists();
        document.getElementById('admin-panel-modal').style.display = 'flex';
      } else {
        alert("Incorrect Password!");
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-chars').style.display = tab === 'chars' ? 'block' : 'none';
      document.getElementById('tab-muts').style.display = tab === 'muts' ? 'block' : 'none';
      document.getElementById('tab-chars-btn').className = `tab-btn ${tab === 'chars' ? 'active' : ''}`;
      document.getElementById('tab-muts-btn').className = `tab-btn ${tab === 'muts' ? 'active' : ''}`;
    }

    function renderAdminLists() {
      const charList = document.getElementById('admin-chars-list');
      charList.innerHTML = '';
      characters.forEach(c => {
        const item = document.createElement('div');
        item.className = 'admin-list-item';
        item.innerHTML = `
          <div>
            <strong>${c.name}</strong> (Val: ${c.value}, Price: $${c.price})
          </div>
          <div>
            <button class="btn-edit" onclick="editChar(${c.id})">✏️</button>
            <button class="btn-danger" onclick="deleteChar(${c.id})">🗑️</button>
          </div>
        `;
        charList.appendChild(item);
      });

      const mutList = document.getElementById('admin-muts-list');
      mutList.innerHTML = '';
      mutations.forEach(m => {
        const item = document.createElement('div');
        item.className = 'admin-list-item';
        item.innerHTML = `
          <div>
            <strong>${m.name}</strong> (+${m.valueAdd} Val, +$${m.priceAdd} Price)
          </div>
          <div>
            <button class="btn-edit" onclick="editMutation(${m.id})">✏️</button>
            <button class="btn-danger" onclick="deleteMutation(${m.id})">🗑️</button>
          </div>
        `;
        mutList.appendChild(item);
      });
    }

    function saveCharacter() {
      const id = document.getElementById('edit-char-id').value;
      const name = document.getElementById('new-name').value;
      const value = parseInt(document.getElementById('new-value').value) || 0;
      const price = parseInt(document.getElementById('new-price').value) || 0;
      const demand = parseInt(document.getElementById('new-demand').value) || 0;

      if (!name) return alert("Please enter a name.");

      if (id) {
        const idx = characters.findIndex(c => c.id === parseInt(id));
        characters[idx] = { id: parseInt(id), name, value, price, demand };
      } else {
        characters.push({ id: Date.now(), name, value, price, demand });
      }

      localStorage.setItem('trade_chars', JSON.stringify(characters));
      resetCharForm();
      renderAdminLists();
    }

    function editChar(id) {
      const c = characters.find(item => item.id === id);
      document.getElementById('edit-char-id').value = c.id;
      document.getElementById('new-name').value = c.name;
      document.getElementById('new-value').value = c.value;
      document.getElementById('new-price').value = c.price;
      document.getElementById('new-demand').value = c.demand;
    }

    function deleteChar(id) {
      characters = characters.filter(c => c.id !== id);
      localStorage.setItem('trade_chars', JSON.stringify(characters));
      renderAdminLists();
    }

    function resetCharForm() {
      document.getElementById('edit-char-id').value = '';
      document.getElementById('new-name').value = '';
      document.getElementById('new-value').value = '';
      document.getElementById('new-price').value = '';
      document.getElementById('new-demand').value = '';
    }

    function saveMutation() {
      const id = document.getElementById('edit-mut-id').value;
      const name = document.getElementById('mut-name').value;
      const valueAdd = parseInt(document.getElementById('mut-value-add').value) || 0;
      const priceAdd = parseInt(document.getElementById('mut-price-add').value) || 0;
      const demandAdd = parseInt(document.getElementById('mut-demand-add').value) || 0;

      if (!name) return alert("Please enter a name.");

      if (id) {
        const idx = mutations.findIndex(m => m.id === parseInt(id));
        mutations[idx] = { id: parseInt(id), name, valueAdd, priceAdd, demandAdd };
      } else {
        mutations.push({ id: Date.now(), name, valueAdd, priceAdd, demandAdd });
      }

      localStorage.setItem('trade_mutations', JSON.stringify(mutations));
      resetMutationForm();
      renderAdminLists();
    }

    function editMutation(id) {
      const m = mutations.find(item => item.id === id);
      document.getElementById('edit-mut-id').value = m.id;
      document.getElementById('mut-name').value = m.name;
      document.getElementById('mut-value-add').value = m.valueAdd;
      document.getElementById('mut-price-add').value = m.priceAdd;
      document.getElementById('mut-demand-add').value = m.demandAdd;
    }

    function deleteMutation(id) {
      mutations = mutations.filter(m => m.id !== id);
      localStorage.setItem('trade_mutations', JSON.stringify(mutations));
      renderAdminLists();
    }

    function resetMutationForm() {
      document.getElementById('edit-mut-id').value = '';
      document.getElementById('mut-name').value = '';
      document.getElementById('mut-value-add').value = '';
      document.getElementById('mut-price-add').value = '';
      document.getElementById('mut-demand-add').value = '';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Init with Default Language (English)
    changeLanguage("en");
  </script>
</body>
</html>
